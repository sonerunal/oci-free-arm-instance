
name: Oracle Always Free ARM

on:
  workflow_dispatch:
  schedule:
    - cron: "7,27,47 * * * *"

permissions:
  contents: read

concurrency:
  group: oracle-arm-provision
  cancel-in-progress: false

jobs:
  create-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      OCI_REGION: eu-turin-1
      OCI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
      SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
      AD_NAME: ${{ secrets.AD_NAME }}
      IMAGE_ID: ${{ secrets.IMAGE_ID }}
      SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Oracle SDK
        run: python -m pip install oci

      - name: Configure Oracle credentials
        shell: bash
        run: |
          set -euo pipefail

          for var in OCI_REGION OCI_USER OCI_TENANCY \
            OCI_FINGERPRINT OCI_PRIVATE_KEY COMPARTMENT_ID \
            SUBNET_ID AD_NAME IMAGE_ID SSH_PUBLIC_KEY; do
            if [ -z "${!var:-}" ]; then
              echo "ERROR: Missing configuration: $var"
              exit 1
            fi
          done

          mkdir -p "$HOME/.oci"
          chmod 700 "$HOME/.oci"

          printf '%s\n' "$OCI_PRIVATE_KEY" \
            > "$HOME/.oci/key.pem"
          chmod 600 "$HOME/.oci/key.pem"

          {
            echo "[DEFAULT]"
            echo "user=$OCI_USER"
            echo "tenancy=$OCI_TENANCY"
            echo "fingerprint=$OCI_FINGERPRINT"
            echo "region=$OCI_REGION"
            echo "key_file=$HOME/.oci/key.pem"
          } > "$HOME/.oci/config"

          chmod 600 "$HOME/.oci/config"

          printf '%s\n' "$SSH_PUBLIC_KEY" \
            | tr -d '\r' > /tmp/oracle_ssh.pub

          ssh-keygen -l -f /tmp/oracle_ssh.pub \
            >/dev/null || {
              echo "ERROR: Invalid SSH public key."
              exit 1
            }

          echo "Configuration validated."

      - name: Check and create instance
        id: create_vm
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import sys
          import oci

          from oci.exceptions import ServiceError

          REGION = os.environ["OCI_REGION"]
          COMPARTMENT = os.environ["COMPARTMENT_ID"]
          SUBNET = os.environ["SUBNET_ID"]
          AD = os.environ["AD_NAME"]
          IMAGE = os.environ["IMAGE_ID"]

          VM_NAME = "turin-arm-vm"
          SHAPE = "VM.Standard.A1.Flex"
          OCPUS = 2
          MEMORY_GB = 12
          BOOT_GB = 50

          print(f"Region: {REGION}")
          print(f"Shape: {SHAPE}")
          print(f"OCPUs: {OCPUS}")
          print(f"Memory: {MEMORY_GB} GB")
          print(f"Boot volume: {BOOT_GB} GB")

          try:
              config = oci.config.from_file(
                  os.path.expanduser("~/.oci/config")
              )
              oci.config.validate_config(config)

              compute = oci.core.ComputeClient(config)

              print("Checking existing instances...")

              response = (
                  oci.pagination.list_call_get_all_results(
                      compute.list_instances,
                      compartment_id=COMPARTMENT
                  )
              )

              instances = response.data

              if not isinstance(instances, list):
                  raise RuntimeError(
                      "Invalid instance list response"
                  )

              existing = [
                  vm for vm in instances
                  if vm.shape == SHAPE
                  and vm.lifecycle_state != "TERMINATED"
              ]

              if existing:
                  print("INSTANCE_EXISTS")
                  print(
                      "An A1 Flex instance already exists."
                  )
                  print("Skipping creation for safety.")
                  sys.exit(0)

              print("No existing A1 Flex instance.")
              print("Attempting VM creation in Turin...")

              with open(
                  "/tmp/oracle_ssh.pub",
                  encoding="utf-8"
              ) as f:
                  ssh_key = f.read().strip()

              details = oci.core.models.LaunchInstanceDetails(
                  availability_domain=AD,
                  compartment_id=COMPARTMENT,
                  display_name=VM_NAME,
                  shape=SHAPE,
                  shape_config=(
                      oci.core.models
                      .LaunchInstanceShapeConfigDetails(
                          ocpus=OCPUS,
                          memory_in_gbs=MEMORY_GB
                      )
                  ),
                  create_vnic_details=(
                      oci.core.models.CreateVnicDetails(
                          subnet_id=SUBNET,
                          assign_public_ip=True
                      )
                  ),
                  source_details=(
                      oci.core.models
                      .InstanceSourceViaImageDetails(
                          source_type="image",
                          image_id=IMAGE,
                          boot_volume_size_in_gbs=BOOT_GB
                      )
                  ),
                  metadata={
                      "ssh_authorized_keys": ssh_key
                  }
              )

              result = compute.launch_instance(details)

              print("SUCCESS: VM creation accepted.")
              print("Instance ID:", result.data.id)
              print("State:", result.data.lifecycle_state)

              # Trigger Gmail notification only on success.
              with open(
                  os.environ["GITHUB_OUTPUT"],
                  "a",
                  encoding="utf-8"
              ) as output:
                  output.write("vm_created=true\n")

              print("GMAIL_NOTIFICATION_REQUESTED")

          except ServiceError as error:
              message = str(error.message or "")
              lower_message = message.lower()

              if (
                  "out of host capacity" in lower_message
                  or "outofhostcapacity" in lower_message
              ):
                  print("NO_CAPACITY")
                  print(
                      "No available ARM capacity in Turin."
                  )
                  print(
                      "The next scheduled run will retry."
                  )
                  sys.exit(0)

              print("ORACLE_API_ERROR")
              print("Status:", error.status)
              print("Code:", error.code)
              print("Message:", message)
              sys.exit(1)

          except Exception as error:
              print("WORKFLOW_ERROR")
              print("Error type:", type(error).__name__)
              print("Message:", str(error))
              sys.exit(1)
          PY

      - name: Send Gmail notification
        if: steps.create_vm.outputs.vm_created == 'true'
        shell: bash
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import smtplib
          from email.message import EmailMessage

          sender = os.environ["GMAIL_USERNAME"]
          password = os.environ["GMAIL_APP_PASSWORD"]

          if not sender or not password:
              raise RuntimeError(
                  "Missing Gmail credentials."
              )

          message = EmailMessage()
          message["From"] = sender
          message["To"] = sender
          message["Subject"] = (
              "Oracle Cloud - ARM VM Olusturuldu!"
          )

          message.set_content(
              "Oracle Cloud VM olusturma istegi "
              "basariyla kabul edildi!\n\n"
              "Bolge: Italy North (Turin)\n"
              "Sunucu: turin-arm-vm\n"
              "Shape: VM.Standard.A1.Flex\n"
              "CPU: 2 OCPU\n"
              "RAM: 12 GB\n"
              "Disk: 50 GB\n\n"
              "Sunucunun RUNNING durumuna "
              "gectigini Oracle Console "
              "uzerinden dogrulayin.\n\n"
              "https://cloud.oracle.com/"
          )

          with smtplib.SMTP_SSL(
              "smtp.gmail.com",
              465,
              timeout=30
          ) as smtp:
              smtp.login(sender, password)
              smtp.send_message(message)

          print("GMAIL_NOTIFICATION_SENT")
          PY

      - name: Show final status
        if: success()
        run: |
          echo "Oracle ARM workflow completed."
          echo "Check the instance log for the result."
